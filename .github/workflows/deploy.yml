name: Deploy Chat App (Go + Vue)

on:
  push:
    branches: [ "main" ]

env:
  SERVER_HOST: quigen.info

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Build Vue (Vite)
      # -----------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vue dependencies
        working-directory: ./vue
        run: npm ci

      - name: Build Vue
        working-directory: ./vue
        run: npm run build
        # → ./vue/dist に成果物生成される

      # 【追加】デプロイ用にファイルを整理するステップ
      - name: Prepare Deployment Files
        run: |
          # 1. public/assets の準備
          mkdir -p public/assets
          # vue/dist/assets があれば、public/assets にコピー
          if [ -d "vue/dist/assets" ]; then
            cp -r vue/dist/assets/* public/assets/
          fi

          # 2. view の準備
          mkdir -p view
          # vue/dist/view があれば、view にコピー
          if [ -d "vue/dist/view" ]; then
            cp -r vue/dist/view/* view/
          fi
          
          # 確認用：ファイル構成を表示
          echo "=== Public Directory ==="
          ls -R public
          echo "=== View Directory ==="
          ls -R view

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go app
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o chat
          # GOOS=linux GOARCH=amd64 go build -o chat

      - name: Debug check secret length
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Length: ${#SSH_PRIVATE_KEY}"
          echo "-----BEGIN-----"
          echo "$SSH_PRIVATE_KEY"
          echo "------END------"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 29870 -H quigen.info >> ~/.ssh/known_hosts

      - name: Generate cache_v.env
        run: |
          CACHEV=$(date +%Y%m%d%H%M)
          echo "CACHE_V=$CACHEV" > infrastructure/cache_v.env
          echo "Generated CACHE_V: $CACHEV"

      - name: Upload cache_v.env
        run: |
          rsync -avz -e "ssh -p 29870" infrastructure/cache_v.env \
            deploy@quigen.info:/Work/chat/infrastructure/cache_v.env

      # -----------------------------------------------------
      # Deploy — BLUE/GREEN RELEASE
      # -----------------------------------------------------
      - name: Upload files to server
        run: |
          RELEASE_DIR="r-$(date +%Y%m%d%H%M)"
          
          echo "Deploying to quigen.info:29870/$RELEASE_DIR"

          # 1. リリースディレクトリを作成 (view用も作成)
          ssh -p 29870 deploy@quigen.info "
            mkdir -p /Work/chat/releases/$RELEASE_DIR/public
            mkdir -p /Work/chat/releases/$RELEASE_DIR/view
          "

          # 2. Go binaryをアップロード
          rsync -avz -e "ssh -p 29870" chat \
            deploy@quigen.info:/Work/chat/releases/$RELEASE_DIR/chat

          # 3. Publicフォルダ全体をアップロード (assets含む)
          rsync -avz -e "ssh -p 29870" public/ \
            deploy@quigen.info:/Work/chat/releases/$RELEASE_DIR/public/

          # 4. Viewフォルダ全体をアップロード (Vueのview含む)
          rsync -avz -e "ssh -p 29870" view/ \
            deploy@quigen.info:/Work/chat/releases/$RELEASE_DIR/view/

          # 5. シンボリックリンクの切り替えとサービス再起動
          ssh -p 29870 deploy@quigen.info "
            # Goバイナリ
            ln -sfn /Work/chat/releases/$RELEASE_DIR/chat /Work/chat/chat &&
            
            # Publicディレクトリ
            ln -sfn /Work/chat/releases/$RELEASE_DIR/public /Work/chat/public &&
            
            # Viewディレクトリ (これも切り替えないと古いhtmlが参照されます)
            ln -sfn /Work/chat/releases/$RELEASE_DIR/view /Work/chat/view &&
            
            sudo systemctl restart chat.service
          "

      - name: Cleanup old releases (keep last 2)
        run: |
          ssh -p 29870 deploy@quigen.info "
            cd /Work/chat/releases &&
            ls -1t | tail -n +3 | xargs -I{} rm -rf {}
          "
