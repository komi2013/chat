name: Deploy Chat App (Go + Vue)

on:
  push:
    branches: [ "main" ]

env:
  SERVER_HOST: quigen.info

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------
      # 1) Checkout repository
      # -----------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 2) Build Vue (Vite)
      # -----------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vue dependencies
        working-directory: ./vue
        run: npm ci

      - name: Build Vue
        working-directory: ./vue
        run: npm run build
        # → /public/vue に成果物生成される

      # -----------------------------------------------------
      # 3) Build Go binary
      # -----------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go app
        run: |
          GOOS=linux GOARCH=amd64 go build -o chat

      - name: Debug check secret length
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Length: ${#SSH_PRIVATE_KEY}"
          echo "-----BEGIN-----"
          echo "$SSH_PRIVATE_KEY"
          echo "------END------"
      # -----------------------------------------------------
      # 4) Setup SSH
      # -----------------------------------------------------
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 29870 -H quigen.info >> ~/.ssh/known_hosts

      # -----------------------------------------------------
      # 5) Deploy — BLUE/GREEN RELEASE
      # -----------------------------------------------------
      - name: Upload files to server
        run: |
          RELEASE_DIR="release-$(date +%Y%m%d%H%M%S)"
          
          # SSH接続オプションを定義 (ポート指定)
          # SSH_OPTIONS="-p $SERVER_PORT"
          
          echo "Deploying to quigen.info:29870/$RELEASE_DIR"

          # 1. リリースディレクトリとVueアセット用のパスを作成
          # 【修正点】 public/assets のディレクトリも作成
          ssh -p 29870 deploy@quigen.info "
            mkdir -p /Work/chat/releases/$RELEASE_DIR/public/assets
          "

          # 2. Go binaryをアップロード
          # 【修正点】 rsyncで -e "ssh $SSH_OPTIONS" を使用してポートを指定
          rsync -avz -e "ssh -p 29870" chat \
            deploy@quigen.info:/Work/chat/releases/$RELEASE_DIR/chat

          # 3. Vue outputsをアップロード
          # 【修正点】 デプロイ先を public/vue/ から public/assets/ に変更
          # 【修正点】 rsyncで -e "ssh $SSH_OPTIONS" を使用してポートを指定
          rsync -avz -e "ssh -p 29870" public/vue/ \
            deploy@quigen.info:/Work/chat/releases/$RELEASE_DIR/public/assets/

          # 4. シンボリックリンクの切り替えとサービス再起動
          ssh -p 29870 deploy@quigen.info "
            ln -sfn /Work/chat/releases/$RELEASE_DIR/chat /Work/chat/chat &&
            # 【修正点】 Vueのシンボリックリンクのターゲットを /public/assets に変更
            ln -sfn /Work/chat/releases/$RELEASE_DIR/public /Work/chat/public &&
            sudo systemctl restart chat.service
          "