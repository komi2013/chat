<!DOCTYPE html>
<html>
<head>
  <title>🚪🚶ログイン</title>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, user-scalable=no" >
  <script src="/js/myGlobal.js?{{.CacheV}}"></script>
  <script src="/js/IndexedDB.js?{{.CacheV}}"></script>
  <style>
    input {
      padding: 5px;
      font-size: 16px;
    }
    button {
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/outsideApp.js"></script>
<div class="menu pc_disp_none">≡</div>

<div id="content">

  <br><br>
  <input id="userID" placeholder="seijiro" />
  <br>
  <button id="setCookieBtn">setCookie</button>

<br><br>

</div>

<div id="ad_right"></div>

<script type="text/javascript">
  document.getElementById('setCookieBtn').addEventListener('click', function() {
    const userIDValue = document.getElementById('userID').value;
    const fd = new FormData();
    fd.append('userID', userIDValue);

    fetch('/SignInTmp/', {
      method: 'POST',
      body: fd,
    })
    .then((response) => {
      console.log(response);
      location.href = '/pushSubscription/'
    })
    .catch((reason) => {
      console.log(reason);
    });
  });
</script>

</body>
</html>
